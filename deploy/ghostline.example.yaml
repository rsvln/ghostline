# ghostline configuration. All keys are described in README.md (Configuration).
# An unknown key stops the service at startup, so a typo cannot silently disable an option.
# After the first start the file can also be edited in the web interface (Settings tab).
# Files of older versions (channels, gateway types quectel/dongle, a top-level pbx section) are
# converted once on start; the old file is kept as ghostline.yaml.bak-v2.

mode: sms                     # sms | full (full also handles calls)

locale:
  default: en                 # en | ru
  web:
  telegram:
  transcript:

# Notification channels, both optional (at least one to get notifications).
clients:
  telegram:                   # empty token: Telegram is off
    token: 123456789:AAExampleTelegramBotToken
    chat_ids:                 # common chats, for lines without their own
      - "100000001"
  ntfy:                       # empty url: ntfy is off
    url:
    token:
    topic:                    # common topic, for lines without their own

web:                          # empty user and password disable authentication
  port: 8889
  user: admin
  password: change-me

logger:
  file: true

gateways:
  - id: pbx
    type: asterisk            # asterisk | yeastar | goip
    ip: 10.0.0.10
    ami_port: 5038
    user: ghostline
    password: ami-secret
    monitor: true             # registration, operator, network, signal of every modem
    pbx: freepbx              # freepbx (default) | managed (docs/managed-pbx.md)
    modems:                   # as named in quectel.conf / dongle.conf
      - name: gsm1
        driver: quectel       # quectel | dongle

# A line without network for this many minutes: a message to its chats/topic; 0: none.
monitor:
  alert_minutes: 2

lines:
  - name: personal
    gateway: pbx
    pattern: gsm1
    modem: gsm1               # a modem of the gateway; yeastar / goip: port: <n>
    number: "+79001234567"

# A plain Asterisk managed by ghostline (docs/managed-pbx.md, docs/asterisk-setup.md):
# ghostline writes its PJSIP, dialplan and modem files, and its lines can have a phone.
#   gateways:
