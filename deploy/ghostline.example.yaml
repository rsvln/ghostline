#       type: asterisk
#       ...
#       pbx: managed
#       managed:
#         conf_dir: /srv/asterisk-conf     # shared with Asterisk
#         asterisk_dir: /etc/asterisk/ghostline
#         sip:
#           tls: { cert: keys/sip.crt, key: keys/sip.key, port: 5061 }
#           external_address: sip.example.org
#           local_nets: [10.0.0.0/8]
#       modems:
#         - { name: gsm1, driver: quectel, data: /dev/serial/by-path/..., audio: /dev/serial/by-path/... }
#   lines:
#     - { ..., phone: { extension: "11", dial: ru, encryption: sdes } }

