name: Pull request checks

on:
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build ghostline.sln -c Release

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same Dockerfile as the release build, but nothing is pushed.
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ghostline/Dockerfile
          push: false
